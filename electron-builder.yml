appId: com.jamilxt.json-editor-desktop
productName: JSON Editor
directories:
  output: release
files:
  - dist/**
  - main.cjs
  - preload.cjs
  - package.json
icon: build/icon
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
  identity: null
linux:
  target:
    - AppImage
    - deb
  category: Development
win:
  target:
    - target: portable
      arch: [x64]
